<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e91e4d"><title>اعلان‌های من | نوین‌شاپ</title><link rel="stylesheet" href="styles.css"><style>
body{background:#f5f7fb}.ann-shell{max-width:1180px;margin:28px auto;padding:0 18px}.ann-hero{background:linear-gradient(125deg,#171d36,#e91e4d);color:white;border-radius:24px;padding:30px;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:0 16px 40px #17213a22}.ann-hero h1{margin:8px 0;font-size:clamp(25px,4vw,38px)}.ann-hero p{margin:0;color:#ffffffd9}.ann-hero .bell{font-size:58px}.ann-actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.ann-actions button,.ann-back{border:1px solid #e0e5ee;background:white;border-radius:12px;padding:11px 15px;cursor:pointer;color:#253047;font:inherit}.ann-actions button.active{background:#e91e4d;color:white;border-color:#e91e4d}.ann-grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}.ann-filters,.ann-list{background:white;border:1px solid #e7eaf1;border-radius:18px;padding:18px}.ann-filters{height:max-content}.ann-filters button{display:flex;width:100%;justify-content:space-between;margin-top:8px;border:0;border-radius:10px;padding:12px;background:#f6f7fb;cursor:pointer;font:inherit}.ann-filters button.active{background:#fff0f4;color:#d71d49}.ann-card{display:flex;gap:14px;padding:18px;border:1px solid #e7eaf1;border-radius:15px;margin-bottom:12px}.ann-card.unread{border-color:#f0a0b5;background:#fffafd}.ann-icon{width:44px;height:44px;flex:0 0 44px;border-radius:13px;display:grid;place-items:center;background:#fff0f4;font-size:22px}.ann-body{flex:1;min-width:0}.ann-meta{display:flex;gap:10px;flex-wrap:wrap;color:#7a8496;font-size:12px}.ann-state{font-weight:700;color:#d51f4b}.ann-body h3{margin:8px 0}.ann-body p{line-height:1.9;color:#505a6c;margin:6px 0 12px;white-space:pre-wrap}.ann-body button{border:1px solid #dfe4ed;border-radius:9px;background:white;padding:8px 11px;cursor:pointer;font:inherit}.ann-code{direction:ltr;display:inline-block;background:#fff0f4;padding:8px 12px;border-radius:8px;font-weight:800;color:#c51d45}.ann-empty{text-align:center;padding:45px 15px;color:#7a8496}.ann-loader{position:fixed;inset:0;background:#fff;z-index:10000;display:grid;place-items:center;transition:opacity .35s,visibility .35s}.ann-loader.hide{opacity:0;visibility:hidden}.ann-loader-inner{text-align:center}.ann-logo{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,#f43f67,#a70d39);color:white;display:grid;place-items:center;font-size:42px;font-weight:900;margin:auto;box-shadow:0 12px 35px #e91e4d55;animation:pulse 1s infinite alternate}.ann-loader p{color:#606a7d}.ann-progress{width:180px;height:5px;border-radius:9px;background:#f6d6df;overflow:hidden;margin:18px auto}.ann-progress:after{content:"";display:block;height:100%;width:40%;background:#e91e4d;border-radius:9px;animation:load 1s infinite ease-in-out}@keyframes pulse{to{transform:translateY(-5px) scale(1.04)}}@keyframes load{from{transform:translateX(180px)}to{transform:translateX(-180px)}}@media(max-width:720px){.ann-grid{grid-template-columns:1fr}.ann-hero{padding:22px}.ann-hero .bell{font-size:42px}.ann-filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}.ann-filters h3{grid-column:1/-1}.ann-filters button{margin:0}.ann-card{padding:13px}}
</style><link rel="icon" type="image/svg+xml" href="assets/novin-favicon.svg"></head><body>
<div class="ann-loader" id="annLoader"><div class="ann-loader-inner"><div class="ann-logo">N</div><h2>نوین‌شاپ</h2><p>در حال آماده‌سازی صندوق اعلان‌ها…</p><div class="ann-progress"></div></div></div>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>نوین‌شاپ<small>فروشگاه دیجیتال</small></span></a><a class="ann-back" href="index.html">← بازگشت به فروشگاه</a></header>
<main class="ann-shell"><section class="ann-hero"><div><span> NOVIN SHOP · NOTIFICATIONS</span><h1>اعلان‌های من <span id="annCount">۰</span></h1><p>تخفیف‌ها، خبرهای فروشگاه و پیام‌های اختصاصی حسابت را اینجا دنبال کن.</p></div><span class="bell">🔔</span></section>
<div class="ann-actions"><button id="markAll">✓ خواندن همه</button><button id="refresh">↻ تازه‌سازی</button></div>
<div class="ann-grid"><aside class="ann-filters"><h3>صندوق اعلان‌ها</h3><button class="active" data-filter="all">همه اعلان‌ها <span id="allCount">۰</span></button><button data-filter="sale">تخفیف‌ها و پیشنهادها</button><button data-filter="success">خبرهای خوب</button><button data-filter="warning">هشدارهای مهم</button><button data-filter="info">اطلاعیه‌های عمومی</button></aside><section class="ann-list"><h2 id="listTitle">همه اعلان‌ها</h2><div id="annList" aria-live="polite"><div class="ann-empty">در حال دریافت اعلان‌ها…</div></div></section></div></main>
<script>
(()=>{const $=s=>document.querySelector(s);const readState=()=>{try{return JSON.parse(localStorage.getItem('novin_state_v2')||'{}')}catch{return {}}};const state=readState();const read=k=>{try{const v=state[k];if(v!==undefined)return v;return JSON.parse(localStorage.getItem('novin_'+k)||'[]')}catch{return []}};const writeStateKey=(k,v)=>{try{const s=readState();s[k]=v;s.savedAt=Date.now();localStorage.setItem('novin_state_v2',JSON.stringify(s))}catch(e){console.warn('Notification state save failed',e)}};const normalize=p=>{let v=String(p||'').replace(/[^0-9]/g,'');if(v.startsWith('98'))v='0'+v.slice(2);return v};let announcements=read('announcements'),personal=read('user_notifications'),session=state.session||null,filter='all';const phone=normalize(session?.phone);const readKey='novin_announcement_read_'+(phone||'guest');const readIds=()=>{try{return JSON.parse(localStorage.getItem(readKey)||'[]')}catch{return []}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const digits=n=>Number(n||0).toLocaleString('fa-IR');let items=[];
async function load(){const latest=readState();session=latest.session||session;personal=Array.isArray(latest.user_notifications)?latest.user_notifications:personal;announcements=Array.isArray(latest.announcements)?latest.announcements:announcements;try{const r=await fetch('/api/announcements',{cache:'no-store'});if(r.ok){const x=await r.json();if(Array.isArray(x)&&x.length)announcements=x}}catch{}const today=new Date().toISOString().slice(0,10);const globals=announcements.filter(a=>a.active!==false&&(!a.expiresAt||a.expiresAt>=today)).map(a=>({...a,_id:'notice-'+a.id,_personal:false,_read:readIds().includes('notice-'+a.id),createdAt:a.createdAt||a.time||Date.now()}));const mine=phone?personal.filter(n=>normalize(n.phone)===phone).map(n=>({...n,_id:String(n.id),_personal:true,_read:!!n.read,createdAt:n.createdAt||n.time||Date.now()})):[];items=[...globals,...mine].sort((a,b)=>Number(b.createdAt)-Number(a.createdAt));render()}
function render(){const visible=filter==='all'?items:items.filter(a=>(a.type||'info')===filter);$('#annCount').textContent=digits(items.length);$('#allCount').textContent=digits(items.length);$('#listTitle').textContent=({'all':'همه اعلان‌ها',sale:'تخفیف‌ها و پیشنهادها',success:'خبرهای خوب',warning:'هشدارهای مهم',info:'اطلاعیه‌های عمومی'})[filter]||'همه اعلان‌ها';document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));$('#annList').innerHTML=visible.length?visible.map(a=>`<article class="ann-card ${a._read?'':'unread'}"><div class="ann-icon">${a.couponCode?'🎁':a.type==='sale'?'％':a.type==='warning'?'⚠️':a.type==='success'?'✓':'🔔'}</div><div class="ann-body"><div class="ann-meta"><span>${a._personal?(a.source==='loyalty-coupon'?'هدیه اختصاصی':'پیام شخصی'):a.type==='sale'?'تخفیف و پیشنهاد':a.type==='warning'?'هشدار مهم':a.type==='success'?'خبر خوب':'اطلاعیه عمومی'}</span><time>${new Date(Number(a.createdAt)||Date.now()).toLocaleString('fa-IR')}</time><span class="ann-state">${a._read?'خوانده‌شده':'خوانده‌نشده'}</span></div><h3>${esc(a.title||'اطلاعیه نوین‌شاپ')}</h3><p>${esc(a.body||a.text||'')}</p>${a.couponCode?`<p>کد تخفیف اختصاصی: <span class="ann-code">${esc(a.couponCode)}</span></p>`:''}<button data-read="${esc(a._id)}" data-personal="${a._personal?'1':'0'}">${a._read?'علامت‌گذاری به‌عنوان خوانده‌نشده':'علامت‌گذاری به‌عنوان خوانده‌شده'}</button></div></article>`).join(''):'<div class="ann-empty"><div style="font-size:40px">🔔</div><h3>اعلانی در این دسته وجود ندارد</h3><p>اعلان‌های جدید در این بخش نمایش داده می‌شوند.</p></div>'}
document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}const b=e.target.closest('[data-read]');if(b){const id=b.dataset.read,one=items.find(a=>a._id===id);if(!one)return;one._read=!one._read;if(one._personal){const n=personal.find(n=>String(n.id)===id&&normalize(n.phone)===phone);if(n)n.read=one._read;writeStateKey('user_notifications',personal)}else{let ids=readIds();ids=one._read?[...new Set([...ids,id])]:ids.filter(x=>x!==id);localStorage.setItem(readKey,JSON.stringify(ids))}render();return}});$('#markAll').onclick=()=>{let ids=readIds();items.forEach(a=>{a._read=true;if(a._personal){const n=personal.find(n=>String(n.id)===a._id&&normalize(n.phone)===phone);if(n)n.read=true}else if(!ids.includes(a._id))ids.push(a._id)});localStorage.setItem(readKey,JSON.stringify(ids));writeStateKey('user_notifications',personal);render()};$('#refresh').onclick=load;document.querySelector('.ann-filters').addEventListener('click',()=>{});load().finally(()=>setTimeout(()=>$('#annLoader').classList.add('hide'),350));})();
</script></body></html>
